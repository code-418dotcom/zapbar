# Pages revalidate on every visit (no stale copies after a deploy); CSS and images may be cached for an hour.
map $sent_http_content_type $cache_control {
    ~text/html "no-cache";
    default    "public, max-age=3600";
}

server {
    listen 80;
    server_name www.zapbar.app;
    return 301 https://zapbar.app$request_uri;
}

server {
    listen 80 default_server;
    server_name zapbar.app _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; font-src 'self'; script-src https://t.magpiemetrics.com; connect-src https://t.magpiemetrics.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $cache_control always;

    location = / { try_files /index.html =404; }
    location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header Content-Security-Policy "default-src 'none'" always; }
    location / { try_files $uri $uri.html =404; }
    error_page 404 /index.html;
}
